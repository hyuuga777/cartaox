server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tipos corretos para os arquivos usados pelo WebAR.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/octet-stream mind;
        application/javascript js;
    }

    # O Nginx deve aceitar os modelos grandes e permitir downloads parciais.
    client_max_body_size 200m;
    sendfile on;
    aio threads;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Comprime HTML/CSS/JS/JSON, que se beneficiam muito de gzip.
    # Não incluímos GLB: os modelos já são binários e têm compressão Draco.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/x-javascript application/json application/manifest+json application/xml image/svg+xml;

    # O HTML e os módulos versionados precisam buscar a versão mais recente.
    location ~* \.(html|js|json|mind)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Modelos 3D: permitem cache normal, Range requests e não passam pelo
    # Service Worker para evitar Cache.put de dezenas de megabytes.
    location ~* \.(glb|gltf|bin)$ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
